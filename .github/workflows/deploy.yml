name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Upload dist/ to the site folder
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
          USER: ${{ secrets.CPANEL_USERNAME }}
        run: |
          rsync -rlz --delete \
            --exclude '.well-known/' --exclude 'cgi-bin/' \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT" \
            dist/ "$USER@$HOST:/home/farhtmed/tem.farhaan.info/"
